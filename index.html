<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICIP Certificate Server</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        #loading {
            font-size: 20px;
            color: #333;
        }

        #offline {
            display: none;
        }

        #offline h2 {
            color: #d32f2f;
        }

        #offline p {
            color: #555;
            line-height: 1.7;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <div id="loading">
        ⏳ সার্ভারের সাথে সংযোগ করা হচ্ছে...
    </div>

    <div id="offline">
        <h2>⚠️ সার্ভার বন্ধ আছে</h2>

        <p>
            "ফেনী কারিগরি প্রশিক্ষণ কেন্দ্র </p>

        <button onclick="checkServer()">
            🔄 আবার চেষ্টা করুন
        </button>
    </div>

</div>


<script>
const SERVER = "https://anwar.tail6ab506.ts.net";
const HEALTH_URL = SERVER + "health";

async function checkServer() {
    const loading = document.getElementById("loading");
    const offline = document.getElementById("offline");

    loading.style.display = "block";
    offline.style.display = "none";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    try {
        const response = await fetch(HEALTH_URL, {
            cache: "no-store",
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (data.status !== "ok") {
            throw new Error("Health check failed");
        }

        // সার্ভার সচল হলে মূল সার্টিফিকেট পেজে যাবে
        window.location.replace(SERVER);

    } catch (error) {
        console.error("SICIP server check failed:", error);
        loading.style.display = "none";
        offline.style.display = "block";
    } finally {
        clearTimeout(timeout);
    }
}

checkServer();
</script>



</body>
  </html>
